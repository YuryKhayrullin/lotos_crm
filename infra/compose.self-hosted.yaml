# Explicit environment/project via --env-file; never use Local credentials.
services:
  caddy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?Choose the staging/production hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Choose the certificate contact}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  app:
    image: ${APP_IMAGE:?Build a reviewed immutable release image}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      APP_ENV: ${APP_ENV:?Explicit staging or production}
      NODE_ENV: production
      CRM_BACKEND: postgres
      APP_URL: ${APP_URL:?HTTPS origin}
      DATABASE_URL: ${DATABASE_URL:?Private runtime role}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Unique authentication secret}
      DOCUMENTS_DIR: /var/lib/lotos-crm/documents/${APP_ENV}
      COACH_REGISTRATION_ENABLED: 'false'
      TRUSTED_PROXY: caddy
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    volumes:
      - documents:/var/lib/lotos-crm/documents/${APP_ENV}
    tmpfs:
      - /tmp:mode=1777,size=128m
      - /app/.next/cache:uid=10001,gid=10001,mode=0700,size=64m
    networks: [frontend, backend]
    depends_on:
      db: { condition: service_healthy }
      documents-init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    mem_limit: 1g
    logging: *logging
  documents-init:
    image: ${APP_IMAGE:?Reviewed release image}
    user: '0:0'
    entrypoint:
      [
        'install',
        '-d',
        '-m',
        '0700',
        '-o',
        '10001',
        '-g',
        '10001',
        '/documents',
        '/documents/objects',
        '/documents/staging',
      ]
    network_mode: none
    volumes: ['documents:/documents']
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: 'no'
  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Dedicated environment database}
      POSTGRES_USER: lotos_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Separate owner password}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?Separate runtime password}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Separate migration password}
      BACKUP_PASSWORD: ${BACKUP_PASSWORD:?Separate backup password}
    volumes:
      - database:/var/lib/postgresql/data
      - ./postgres/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    networks: [backend]
    # No published database port, including no 0.0.0.0 mapping.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'PGPASSWORD="$$POSTGRES_PASSWORD" PGCONNECT_TIMEOUT=2 psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null',
        ]
      interval: 10s
      timeout: 4s
      retries: 10
    stop_grace_period: 30s
    mem_limit: 1g
    logging: *logging
  migrate:
    image: ${MIGRATOR_IMAGE:?Reviewed migration image, same release}
    profiles: [ops]
    restart: 'no'
    environment:
      APP_ENV: ${APP_ENV}
      CRM_BACKEND: postgres
      APP_URL: ${APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:?Private separate migrator role}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  backup:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    profiles: [ops]
    restart: 'no'
    environment:
      APP_ENV: ${APP_ENV}
      PGHOST: db
      PGUSER: lotos_backup
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${BACKUP_PASSWORD}
      PGCONNECT_TIMEOUT: '5'
    entrypoint: ['sh', '/ops/backup-bundle.sh']
    volumes:
      - ./ops/backup-bundle.sh:/ops/backup-bundle.sh:ro
      - documents:/documents:ro
      - ${BACKUPS_DIR:?Private host backup directory}:/backups
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    logging: *logging
networks:
  frontend:
  backend: { internal: true }
volumes:
  database:
  documents:
  caddy_data:
  caddy_config:
