name: CI

on:
  push:
    branches: [main, master, 'migration/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lotos-gitleaks"
          cd "$RUNNER_TEMP/lotos-gitleaks"
          curl -fsSL -o gitleaks_8.30.1_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          rg ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - run: npm run env:init
      - run: npm run security:secrets
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/lotos-gitleaks/gitleaks
      - run: npm run env:check -- local
      - run: npm run env:check -- test
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm run test:postgres
      - run: npm run test:auth:postgres
      - run: npm run test:domain:postgres
      - run: npm run release:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:auth:browser
